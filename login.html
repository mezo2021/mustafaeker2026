<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDU ARENA</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth"><section class="authbox"><div class="eyebrow">EDU ARENA</div><h1 class="title">بوابة التحدّي الذكي 🚀</h1><p class="sub">منصة متعددة الشاشات للمسابقات التعليمية، التقدم، الإنجازات ولوحة الصدارة.</p><div class="field"><label>اسم المتسابق</label><input id="name" placeholder="اكتب اسمك"></div><div class="field"><label>رمز الدخول</label><input id="pass" type="password" placeholder="2026"></div><div class="notice">نسخة تجريبية محلية: بيانات الحساب محفوظة على هذا الجهاز فقط.</div><button class="btn" onclick="enter()">دخول المنصة</button></section></main><script>function enter(){const n=document.querySelector('#name').value.trim()||'متسابق';const p=document.querySelector('#pass').value.trim();if(p!=='2026')return alert('رمز الدخول غير صحيح');localStorage.setItem('eduArenaName',n);location.href='index.html'}</script></body></html>
